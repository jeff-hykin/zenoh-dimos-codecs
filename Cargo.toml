[package]
name = "zenoh-dimos-codecs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "zenoh-web codecs for ROS 2 and dimos images, depth and point clouds"
repository = "https://github.com/jeff-hykin/zenoh-dimos-codecs"
license-file = "LICENSE"
readme = "README.md"
# only what building the library needs (no test fixtures)
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE"]

[dependencies]
zenoh-web = { version = "0.3.0", git = "https://github.com/jeff-hykin/zenoh-web", rev = "0cdee77e81dcbe87e70b8524a7413ce7470b7de3" }
anyhow = "1"
# pure Rust decoders
zune-jpeg = "0.5"
png = "0.18"
image-webp = "0.2"
jxl-oxide = "0.12"
