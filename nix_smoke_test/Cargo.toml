[package]
name = "zenoh-dimos-codecs-example"
version = "0.1.0"
edition = "2024"
publish = false
description = "Smoke test for the nix builds: a zenoh-gateway server with every dimos / ROS 2 codec on loopback, then an encoder probe"

[dependencies]
zenoh-dimos-codecs = { path = "..", features = ["videotoolbox", "gstreamer"] }
zenoh-gateway = { version = "0.6.0", git = "https://github.com/jeff-hykin/zenoh-gateway", branch = "jeff/zenoh_1.10.1" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"

[patch.crates-io]
# zenoh 1.10.1 plus a routing fix: https://github.com/jeff-hykin/zenoh-vendor
zenoh = { git = "https://github.com/jeff-hykin/zenoh-vendor", tag = "zenoh-1.10.1-patch.1" }
