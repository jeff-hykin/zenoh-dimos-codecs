[package]
name = "zenoh-dimos-codecs-example"
version = "0.1.0"
edition = "2024"
publish = false
description = "Smoke test for the nix builds: a zenoh-gateway server with every dimos / ROS 2 codec on loopback, then an encoder probe"

[dependencies]
zenoh-dimos-codecs = { path = "..", features = ["videotoolbox", "gstreamer"] }
zenoh-gateway = { version = "0.4.1", git = "https://github.com/jeff-hykin/zenoh-gateway", rev = "63b72ddd507fd31cd91dc1c3cc350336ebe08b89" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
