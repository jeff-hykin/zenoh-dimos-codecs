[package]
name = "zenoh-dimos-codecs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "zenoh-web codecs for ROS 2 and dimos images, depth and point clouds"
repository = "https://github.com/jeff-hykin/zenoh-dimos-codecs"
publish = false

[dependencies]
zenoh-web = { git = "https://github.com/jeff-hykin/zenoh-web", rev = "f6f9de2c5e3a069b871389460db3c33d88fcafa7" }
anyhow = "1"
# pure Rust decoders
zune-jpeg = "0.5"
png = "0.18"
image-webp = "0.2"
jxl-oxide = "0.12"
